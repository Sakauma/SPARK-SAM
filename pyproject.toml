[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sparksam"
version = "1.0.0"
description = "Anonymous reproduction code for SPARK-SAM infrared small-target segmentation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.5.1",
  "torchvision>=0.20.1",
  "numpy>=1.24.4",
  "Pillow>=9.4.0",
  "tqdm>=4.66.1",
  "hydra-core>=1.3.2",
  "iopath>=0.1.10",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.4.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 140
target-version = "py310"
extend-exclude = ["sam2"]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]
